    source: >-
      IDBI does not publish a cash-credit / term-loan split of its MSME book.
      55/45 is the split the July 2026 DRISHTi build used and is retained so the
      two MSME portfolios stay comparable with it.
    url: "none"
    retrieved_on: "2026-09-16"
    confidence: assumed

  auto_education_personal_split:
    value: {auto: 0.45, education: 0.30, retail_unsecured: 0.25}
    source: >-
      IDBI reports Auto, Education and Personal as one 6,787 cr line. The split
      is our judgement: vehicle finance is the largest of the three at a
      public-sector bank, education next, and IDBI is not a large unsecured
      personal-loan lender.
    url: "none"
    retrieved_on: "2026-09-16"
    confidence: assumed

  annual_slippage_band:
    value: [0.03, 0.05]
    source: >-
      The whole book's 12-month label rate, pre-registered as criterion DR-03
      in validation/criteria.yaml and as gate G2 in the build plan, both
      committed before any result existed. It lives here so the generator can
      ASSERT it in-script (plan SD-D5) against the same number the validation
      pack gates on, instead of against a constant copied into a test.
    url: "none"
    retrieved_on: "2026-09-16"
    confidence: assumed

  sma2_to_npa_event_ratio_band:
    value: [1.0, 8.0]
    source: >-
      Plausible range for how much more OFTEN an account enters SMA-2 than it
      goes NPA, per unit of time. The two labels carry different windows (6
      months and 12), so the raw rates are not comparable; the ratio asserted
      is (sma2_within_6m / 6) divided by (default_within_12m / 12). The floor
      is 1.0 because a book cannot reach NPA more often than it reaches the
      61-90 bucket on the way — most SMA-2 cures. IDBI reported SMA-to-standard
      advances of 1.20% at Mar-2026 (a STOCK, all of SMA-0/1/2) against a 0.63%
      annual slippage ratio (a FLOW): with an SMA-2 dwell of one to two months,
      that implies entries into SMA-2 several times more frequent than
      slippages. The band is deliberately wide; it is a sanity check, not a
      target, and the realised ratio is REPORTED rather than tuned to.
    url: "https://www.idbi.bank.in/pdf/Analyst_Mar-2026.pdf"
    retrieved_on: "2026-09-16"
    confidence: low

  mix_shrinkage_lambda:
    value: 0.60
    source: >-
      Account shares are shrunk toward a uniform eight-way mix as
      (1 - lambda) * derived + lambda / 8. At lambda = 0.60 the thinnest
      portfolio carries 8.3% of accounts instead of 2.0%, which is what
      criterion DR-06 (per-portfolio AUC with a bootstrap CI, min_n = 0) needs
      to be answerable for all eight. The undistorted shares are recorded on
      each portfolio as `account_share_undistorted`. This IS a departure from
      the real book and belongs on the known-unrealisms list.
    url: "none"
    retrieved_on: "2026-09-16"
    confidence: assumed

  rbi_sectoral_credit_growth_yoy_pct:
