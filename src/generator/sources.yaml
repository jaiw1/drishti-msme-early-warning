# =============================================================================
# DRISHTi synthetic population — SOURCED PARAMETERS
# =============================================================================
# Every empirical number the generator uses about the Indian lending market
# lives here, never in code. Each parameter is a node:
#
#   value:        what the generator reads
#   source:       who published it, in words a reviewer can check
#   url:          where to read it ("none" if and only if confidence: assumed)
#   retrieved_on: the date we read it
#   confidence:   high | medium | low | assumed
#   note:         optional — how the number was derived or why it is what it is
#
# `assumed` is honest and expected: much of a bank's internal book composition
# is simply not public. An assumed node MUST carry url "none"; a sourced node
# MUST carry a real link. `src/generator/sources.py:validate()` enforces both
# directions, and tests/test_sources_schema.py fails the build if it drifts.
#
# WHAT IS *NOT* HERE: the simulation's shape constants (AR(1) phi, the stress
# ramp split, channel elasticities, lead months). They describe the simulator,
# not the market; no source could back them, so pretending otherwise would be
# worse than leaving them in `portfolios.py` where they are documented as
# design choices.
#
# TWO THINGS A REVIEWER SHOULD READ FIRST
#   1. book.*  — IDBI's actual FY26 retail book, and the arithmetic that turns
#      its RUPEE shares into the ACCOUNT shares a panel needs.
#   2. The default-rate bands. The synthetic book slips FAR harder than IDBI's
#      real one (see book.idbi_fy26.slippage_ratio_pct: 0.63%). We target
#      system-wide SECTORAL GNPA levels instead, which is roughly 5x IDBI's
#      current slippage. That is a deliberate, disclosed departure — an
#      early-warning model needs enough positives to learn from — and it is on
#      the known-unrealisms list for DATA_CARD.md. This panel is NOT a
#      representation of IDBI's book quality.
# =============================================================================

meta:
  schema_version:
    value: "1.0.0"
    source: "This file's own contract; bumped when a node's shape changes."
    url: "none"
    retrieved_on: "2026-09-16"
    confidence: assumed
  book_scope:
    value: "IDBI reported Retail segment, restricted to the eight DRISHTi portfolios"
    source: >-
      IDBI reports Retail (70% of gross advances) vs Corporate (30%). Its Retail
      line ALREADY contains Agriculture and MSME as sub-lines of Non-Structured
      Retail Advances, so for IDBI "Retail" is what other public-sector banks
      call RAM — do not add a RAM bucket on top of it. Corporate (Large + Mid
      Corporate Group) is out of DRISHTi's scope, and so are the retail lines
      DRISHTi has no portfolio for: Gold Loan, bulk/centralised business, staff
      and other retail.
    url: "https://www.idbi.bank.in/pdf/Analyst_Mar-2026.pdf"
    retrieved_on: "2026-09-16"
    confidence: high
  mix_basis:
    value: "accounts"
    source: >-
      Banks publish the book by VALUE; the panel is one row per ACCOUNT-month.
      Account shares are therefore derived as (value share / mean ticket),
      renormalised — then shrunk toward a uniform mix (see
      book.mix_shrinkage_lambda) so no portfolio is too thin to carry a
      per-portfolio AUC with a bootstrap CI.
    url: "none"
    retrieved_on: "2026-09-16"
    confidence: assumed

