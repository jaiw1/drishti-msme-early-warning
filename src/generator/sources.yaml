          overdraft account running persistently under about a fifth of its
          sanctioned limit, or over about nine-tenths, as a monitoring red
          flag — implying a genuinely active, healthy limit is conventionally
          expected to sit in the upper-middle of that band, which is our
          reading of common IDBI/PSU-bank practice of running a working-
          capital limit close to sanction between annual renewals. Our own
