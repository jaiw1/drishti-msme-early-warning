      value: 0.06
      source: >-
        SD-D4. Probability that a healthy month's collection falls short for a
        reason that is not distress: a part-payment, an insurance or fee debit
        that ate the standing instruction, a transfer initiated on the due date
        that settled the next working day. Together with
        measurement.payment_reversal_rate this is why a bank's own
        collection-ratio series is not a clean stress signal, and it was 3% in
        the July 2026 build — half of what a book with a quarter of its NACH
        debits returning at first presentation would show.
