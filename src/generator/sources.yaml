        every defaulter showing EVERY link: turnover fell AND the limit crept up
        AND the collateral slipped AND the salary gapped, all coherently, all
        driven by one number. Real deterioration is not like that. A trader's
        turnover collapses while the promoter's salary account keeps ticking; a
        landlord's rent keeps arriving while the business behind the LAP dies; a
        farmer's KCC renewal slips while the crop receipt is fine because the
        problem was a medical bill. Coherence across ten instruments is what
        makes a synthetic book separable at 0.97 when published bank
