# =============================================================================
# DRISHTi synthetic population — SOURCED PARAMETERS
# =============================================================================
# Every empirical number the generator uses about the Indian lending market
# lives here, never in code. Each parameter is a node:
#
#   value:        what the generator reads
#   source:       who published it, in words a reviewer can check
#   url:          where to read it ("none" if and only if confidence: assumed)
#   retrieved_on: the date we read it
#   confidence:   high | medium | low | assumed
#   note:         optional — how the number was derived or why it is what it is
#
# `assumed` is honest and expected: much of a bank's internal book composition
# is simply not public. An assumed node MUST carry url "none"; a sourced node
# MUST carry a real link. `src/generator/sources.py:validate()` enforces both
# directions, and tests/test_sources_schema.py fails the build if it drifts.
#
# WHAT IS *NOT* HERE: the simulation's shape constants (AR(1) phi, the stress
# ramp split, channel elasticities, lead months). They describe the simulator,
# not the market; no source could back them, so pretending otherwise would be
# worse than leaving them in `portfolios.py` where they are documented as
# design choices.
#
# TWO THINGS A REVIEWER SHOULD READ FIRST
#   1. book.*  — IDBI's actual FY26 retail book, and the arithmetic that turns
#      its RUPEE shares into the ACCOUNT shares a panel needs.
#   2. The default-rate bands. The synthetic book slips FAR harder than IDBI's
#      real one (see book.idbi_fy26.slippage_ratio_pct: 0.63%). We target
#      system-wide SECTORAL GNPA levels instead, which is roughly 5x IDBI's
#      current slippage. That is a deliberate, disclosed departure — an
#      early-warning model needs enough positives to learn from — and it is on
#      the known-unrealisms list for DATA_CARD.md. This panel is NOT a
#      representation of IDBI's book quality.
# =============================================================================

meta:
  schema_version:
    value: "1.0.0"
    source: "This file's own contract; bumped when a node's shape changes."
    url: "none"
    retrieved_on: "2026-09-16"
    confidence: assumed
  book_scope:
    value: "IDBI reported Retail segment, restricted to the eight DRISHTi portfolios"
    source: >-
      IDBI reports Retail (70% of gross advances) vs Corporate (30%). Its Retail
      line ALREADY contains Agriculture and MSME as sub-lines of Non-Structured
      Retail Advances, so for IDBI "Retail" is what other public-sector banks
      call RAM — do not add a RAM bucket on top of it. Corporate (Large + Mid
      Corporate Group) is out of DRISHTi's scope, and so are the retail lines
      DRISHTi has no portfolio for: Gold Loan, bulk/centralised business, staff
      and other retail.
    url: "https://www.idbi.bank.in/pdf/Analyst_Mar-2026.pdf"
    retrieved_on: "2026-09-16"
    confidence: high
  mix_basis:
    value: "accounts"
    source: >-
      Banks publish the book by VALUE; the panel is one row per ACCOUNT-month.
      Account shares are therefore derived as (value share / mean ticket),
      renormalised — then shrunk toward a uniform mix (see
      book.mix_shrinkage_lambda) so no portfolio is too thin to carry a
      per-portfolio AUC with a bootstrap CI.
    url: "none"
    retrieved_on: "2026-09-16"
    confidence: assumed

# -----------------------------------------------------------------------------
# IDBI's actual book, and the arithmetic from rupees to accounts.
# -----------------------------------------------------------------------------
book:
  idbi_fy26:
    gross_advances_cr:
      value: 259274
      source: "IDBI Bank Investors Presentation, Q4 FY2025-26, Business Performance / Advances."
      url: "https://www.idbi.bank.in/pdf/Analyst_Mar-2026.pdf"
      retrieved_on: "2026-09-16"
      confidence: high
    retail_advances_cr:
      value: 182294
      source: >-
        Structured Retail 107,712 cr + Non-Structured Retail 74,582 cr = 70% of
        gross advances; Corporate (Large 51,563 + Mid 25,417) is the other 30%.
      url: "https://www.idbi.bank.in/pdf/Analyst_Mar-2026.pdf"
      retrieved_on: "2026-09-16"
      confidence: high
    structured_retail_cr:
      value: {housing: 75285, lap: 21968, auto_education_personal: 6787, others: 3672}
      source: >-
        IDBI Investors Presentation Q4 FY2025-26, Structured Retail Advances.
        The four lines sum exactly to the reported 107,712 cr. IDBI does NOT
        split Auto / Education / Personal — they are one combined line.
      url: "https://www.idbi.bank.in/pdf/Analyst_Mar-2026.pdf"
      retrieved_on: "2026-09-16"
      confidence: high
    non_structured_retail_cr:
      value: {msme: 22826, gold: 21321, agri: 13589, bulk_business: 12649, other_retail: 4197}
      source: >-
        IDBI Investors Presentation Q4 FY2025-26, Non-Structured Retail
        Advances. The five values sum exactly to the reported 74,582 cr, but the
        deck's chart carries no machine-readable legend, so the mapping of
        number to LABEL is a best reading rather than a confirmed one.
      url: "https://www.idbi.bank.in/pdf/Analyst_Mar-2026.pdf"
      retrieved_on: "2026-09-16"
      confidence: medium
      note: >-
        Cross-check: on the priority-sector/ANBC basis the same deck reports
        Agriculture 41,073 cr (18.18% of ANBC) and MSME 34,626 cr (15.33%).
        Those are roughly double the numbers above because ANBC counts agri and
        MSME exposure booked anywhere in the bank, including Corporate. The
        product-wise retail figures are the right basis for a retail panel.
    gnpa_pct:
      value: 2.32
      source: "IDBI Bank Q4 FY2025-26 results: GNPA 2.32%, NNPA 0.15%, PCR 99.39%."
      url: "https://www.idbi.bank.in/pdf/Analyst_Mar-2026.pdf"
      retrieved_on: "2026-09-16"
      confidence: high
    slippage_ratio_pct:
      value: 0.63
      source: >-
        Annualised fresh-NPA (net basis) for FY26, down from 0.73% in FY25.
        SMA-to-standard-advances was 1.20% at Mar-26 (1.51% at Mar-25).
      url: "https://www.idbi.bank.in/pdf/Analyst_Mar-2026.pdf"
      retrieved_on: "2026-09-16"
      confidence: high
      note: >-
        READ THIS BEFORE QUOTING ANY DRISHTi DEFAULT RATE. The synthetic book is
        calibrated to sectoral GNPA levels (3-4% annual), not to IDBI's 0.63%.
        The gap is deliberate and disclosed; DRISHTi's numbers are not IDBI's.

  msme_cc_share_of_msme:
    value: 0.55
    source: >-
      IDBI does not publish a cash-credit / term-loan split of its MSME book.
      55/45 is the split the July 2026 DRISHTi build used and is retained so the
      two MSME portfolios stay comparable with it.
    url: "none"
    retrieved_on: "2026-09-16"
    confidence: assumed

  auto_education_personal_split:
    value: {auto: 0.45, education: 0.30, retail_unsecured: 0.25}
    source: >-
      IDBI reports Auto, Education and Personal as one 6,787 cr line. The split
      is our judgement: vehicle finance is the largest of the three at a
      public-sector bank, education next, and IDBI is not a large unsecured
      personal-loan lender.
    url: "none"
    retrieved_on: "2026-09-16"
    confidence: assumed

  mix_shrinkage_lambda:
    value: 0.60
    source: >-
      Account shares are shrunk toward a uniform eight-way mix as
      (1 - lambda) * derived + lambda / 8. At lambda = 0.60 the thinnest
      portfolio carries 8.3% of accounts instead of 2.0%, which is what
      criterion DR-06 (per-portfolio AUC with a bootstrap CI, min_n = 0) needs
      to be answerable for all eight. The undistorted shares are recorded on
      each portfolio as `account_share_undistorted`. This IS a departure from
      the real book and belongs on the known-unrealisms list.
    url: "none"
    retrieved_on: "2026-09-16"
    confidence: assumed

  rbi_sectoral_credit_growth_yoy_pct:
    value: {non_food: 19.1, agriculture: 17.0, industry: 20.0, services: 22.9,
            personal_loans: 16.2}
    source: >-
      RBI, Sectoral Deployment of Bank Credit, July 2026 (released 31-Aug-2026).
      The press release publishes growth rates in prose; the outstanding-amount
      tables are in a linked spreadsheet we could not parse, so no absolute
      product-level rupee figures are used here.
    url: "https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=63478"
    retrieved_on: "2026-09-16"
    confidence: medium
    note: "Context only — the generator does not read this node."

