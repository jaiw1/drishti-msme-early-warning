  # ---------------------------------------------------------------------------
  # SD-D4 — the population a real book has that a clean simulator does not.
  #
  # Four families, all switchable together by GeneratorConfig(noise=False):
  #   silent_default  the defaulters who show no warning chain at all
  #   transient       recoverable stress on healthy accounts (hard negatives)
  #   confounders     calendar effects that are not stress
  #   measurement     how the bank's instruments mis-report what is there
  #   missingness     what the bank simply does not have that month
  #
  # Almost every number here is `assumed`: no bank publishes how often its
  # borrowers part-pay by accident, and no regulator publishes the share of
  # NPAs that arrive with no warning. The shares are set to the levels credit
  # practitioners describe and are recorded as judgement, not as evidence.
  # ---------------------------------------------------------------------------
  silent_default:
    definition:
      value: "a defaulter whose observation channels stay healthy until 1-2 months before NPA"
      source: >-
        Fraud and fund diversion, the death or hospitalisation of the earning
        member, the sudden loss of a single large buyer, a job loss with no
        notice: events that end an account's ability to pay without a preceding
        deterioration the bank could have watched. RBI's own early-warning
        framework exists because a share of NPAs does NOT announce itself, and
        a synthetic book where every defaulter shows every link of the chain is
        a book on which any model looks superhuman.
      url: "none"
      retrieved_on: "2026-09-16"
      confidence: assumed
    share:
      value: 0.08
      source: >-
        Book-wide share of defaulters with no usable warning chain. Set at the
        plan's 8%; the per-portfolio shares below are weighted to it. No public
        figure exists for the "no prior warning" share of slippages — banks
        publish SMA ageing, not the share of NPAs that never passed through
        SMA-1 with a visible cash-flow cause.
      url: "none"
      retrieved_on: "2026-09-16"
      confidence: assumed
    onset_months_bounds:
      value: [1, 2]
      source: >-
        How long the compressed slide lasts. 1 month is a true silent default
        (nothing moves before the payment stops); 2 is a fast one. Drawn
        uniformly, so the median silent defaulter's chain leads days-past-due
        by nothing at all.
      url: "none"
      retrieved_on: "2026-09-16"
      confidence: assumed
    severity_floor:
      value: 1.15
      source: >-
        A silent default is steep by construction — the borrower stops, rather
        than slides — so its latent severity is floored above the population
        mean. It changes how hard the last two months look, never whether the
        account defaults.
      url: "none"
      retrieved_on: "2026-09-16"
      confidence: assumed

