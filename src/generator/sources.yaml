        transactions by count; most are re-presented and many clear within
        days, but the rest carry into the next cycle. This is the reason
        "the account is late" is a WEAK signal in a real Indian retail book and
        a near-perfect one in a clean simulator: RBI's SMA-0 bucket (1-30 DPD)
        is heavily populated by accounts that are not deteriorating at all.
