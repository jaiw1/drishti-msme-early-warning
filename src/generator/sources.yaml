        the portfolio's collection elasticity — drawn per borrower and centred
        on 1, so the median defaulter part-pays exactly as deeply as before and
        the spread around them is real. The shared spine is never switched OFF
        the way a product channel can be (shared.chain_visibility), because
        money not arriving is the definition of the event; but a borrower who
        pays in full until the month they stop, and one who pays 60% for a
        year, are both real and the panel had only the second kind.
      url: "none"
      retrieved_on: "2026-09-16"
      confidence: assumed
    bounce_dpd_ladder:
      value: [0.0, 16.0, 43.0, 68.0]
